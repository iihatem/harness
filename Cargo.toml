[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
brush-parser = "=0.4.0"
harness-config = { path = "crates/harness-config" }
harness-context = { path = "crates/harness-context" }
harness-core = { path = "crates/harness-core" }
harness-lsp = { path = "crates/harness-lsp" }
harness-providers = { path = "crates/harness-providers", default-features = false }
harness-sandbox = { path = "crates/harness-sandbox" }
harness-shell = { path = "crates/harness-shell" }
harness-tools = { path = "crates/harness-tools" }
harness-tui = { path = "crates/harness-tui" }
harness-usage = { path = "crates/harness-usage" }
xtask = { path = "crates/xtask" }
async-stream = "0.3"
base64 = "0.23.1"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
eventsource-stream = "0.2.3"
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
ignore = "0.4.33"
landlock = "0.4.7"
libc = "0.2"
jsonschema = "0.57.0"
keyring-core = "1.0.0"
lsp-types = "0.97"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
nucleo-matcher = "0.3.1"
proptest = { version = "1", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1"
# Bundled SQLite for the usage report cache (`harness-usage`): nothing needs installing.
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
seccompiler = "=0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

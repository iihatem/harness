[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
harness-config = { path = "crates/harness-config" }
harness-core = { path = "crates/harness-core" }
harness-providers = { path = "crates/harness-providers" }
harness-tools = { path = "crates/harness-tools" }
async-stream = "0.3"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
eventsource-stream = "0.2.3"
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
ignore = "0.4.33"
jsonschema = "0.57.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

[package]
name = "harness-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
harness-context.workspace = true
harness-core.workspace = true
ignore.workspace = true
libc.workspace = true
nix.workspace = true
nucleo-matcher.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
serde_json.workspace = true
similar.workspace = true
syntect.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

# crossterm's default input source on Linux (mio, edge-triggered, 1 KiB a read) leaves keys
# waiting in the terminal until more arrive; `/dev/tty` polled by level does not.
[target.'cfg(target_os = "linux")'.dependencies]
crossterm = { workspace = true, features = ["use-dev-tty"] }

[dev-dependencies]
harness-tools.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

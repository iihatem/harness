[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# bincode 1.3.3 is unmaintained (its team calls it complete). syntect decodes with it only the
# syntax and theme dumps built into harness, never input from outside.
# zbus_names, zvariant and zvariant_derive are merged into zbus upstream and no longer maintained
# as standalone crates; they come only with the Linux Secret Service keyring (zbus 5), which has
# no release that drops them yet. These are maintenance notices, not vulnerabilities.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "syntect decodes only the syntax and theme dumps built into harness with bincode" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained as a standalone crate; zbus 5 (Secret Service keyring) still depends on it and no fixed release exists" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained as a standalone crate; zbus 5 (Secret Service keyring) still depends on it and no fixed release exists" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained as a standalone crate; zbus 5 (Secret Service keyring) still depends on it and no fixed release exists" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "BSL-1.0", "MIT-0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
